[project]
name = "smarts-llm-annotator"
version = "0.1.0"
description = "LLM annotation of SMARTS patterns, with help of similarity to existing filters and names of smallest matched compounds."
authors = [
    {name = "Adam Hanzlik",email = "hanzlika@img.cas.cz"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "openai (>=1.109.1,<2.0.0)",
    "rdkit (>=2025.9.1,<2026.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "pytz (>=2025.2,<2026.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
